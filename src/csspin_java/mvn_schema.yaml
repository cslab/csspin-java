# -*- mode: yaml; coding: utf-8 -*-
#
# Schema of the mvn plugin for csspin

mvn:
    type: object
    help: Configuration regarding the mvn plugin for csspin
    properties:
        exe:
            type: path
            help: The mvn executable
        version:
            type: str
            help: Version of Apache Maven to provision
        goals:
            type: list
            help: List of goals to be executed by the mvn plugin
        opts:
            type: list
            help: Options passed to the mvn call
        defines:
            type: object
            help: Key-value pairs for defining properties in the mvn call
        pom_file:
            type: path
            help: Path to the pom.xml file
        packages:
            type: list
            help: List of packages to be included in the build
        mirrors:
            type: list
            help: |
                Base URLs to download the Maven distribution from, tried in
                order. The plugin appends ``mvn.url`` to each one.
        url:
            type: str
            help: |
                Path of the Maven distribution archive (``.tar.gz``) below
                each entry of ``mvn.mirrors``
        use:
            type: str
            help: Use a local Apache Maven installation
        install_dir:
            type: path
            help: Directory to store caches
